name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Triggers on version tags like v0.1.0, v1.0.0-beta.1

jobs:
  publish:
    permissions:
      id-token: write  # Required for OIDC authentication to pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # Official Dart team maintained workflow
    # Handles all validation, checks, and publishing automatically
