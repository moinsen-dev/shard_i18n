name: shard_i18n
description: Runtime, sharded, msgid-based i18n for Flutter with no codegen. Supports dynamic language switching, plurals, interpolation, and fallback chains.
version: 0.4.1
homepage: https://github.com/moinsen-dev/shard_i18n
repository: https://github.com/moinsen-dev/shard_i18n
issue_tracker: https://github.com/moinsen-dev/shard_i18n/issues
topics:
  - i18n
  - internationalization
  - localization
  - l10n
  - translation
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
